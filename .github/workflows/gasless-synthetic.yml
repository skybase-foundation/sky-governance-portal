name: Gasless vote synthetic check

# Casts one real gasless vote against production per day (signature -> /api/polling/vote ->
# Privy relayer -> Arbitrum) and alerts the ops Discord channel when any step fails.
# Each run spends relayer gas, so keep it to one scheduled run per day.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Send a wrong secret to verify that the failure alert fires
        type: boolean
        default: false

permissions:
  contents: read

concurrency: gasless-synthetic

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://vote.sky.money
      NETWORK: mainnet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Kept apart from the vote step so that no dependency code runs with the backdoor secret in its env
      - name: Sign a test ballot
        id: ballot
        run: |
          set -euo pipefail
          ballot=$(node scripts/generateTestBallot.mjs "$NETWORK")
          echo "json=$ballot" >> "$GITHUB_OUTPUT"

      - name: Cast gasless vote
        env:
          BALLOT: ${{ steps.ballot.outputs.json }}
          GASLESS_BACKDOOR_SECRET: ${{ secrets.GASLESS_BACKDOOR_SECRET }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          set -euo pipefail

          secret="${GASLESS_BACKDOOR_SECRET:?GASLESS_BACKDOOR_SECRET repo secret is not set}"
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            secret="simulated-failure"
          fi

          vote=$(jq -c --arg secret "$secret" '. + {secret: $secret}' <<<"$BALLOT" |
            curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data @- "$BASE_URL/api/polling/vote") ||
            { echo "$vote"; exit 1; }
          echo "$vote"

          tx_id=$(jq -er '.transactionId' <<<"$vote")
          echo "tx_id=$tx_id" >> "$GITHUB_ENV"

      - name: Wait for the relay transaction to be mined
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do
            tx=$(curl -sS --fail-with-body --retry 2 "$BASE_URL/api/polling/relayer-tx?network=$NETWORK&txId=$tx_id") ||
              { echo "$tx"; exit 1; }
            status=$(jq -r '.status' <<<"$tx")
            echo "$status"
            case "$status" in
              confirmed | finalized)
                echo "$tx"
                exit 0
                ;;
              failed | execution_reverted | provider_error)
                echo "$tx"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Relay transaction $tx_id was not mined within 5 minutes"
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          GASLESS_WEBHOOK_URL: ${{ secrets.GASLESS_WEBHOOK_URL }}
        run: |
          jq -nc --arg content "Gasless vote synthetic check failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{content: $content}' |
            curl -sS --fail-with-body -H 'Content-Type: application/json' --data @- "$GASLESS_WEBHOOK_URL"

  # Reads the relayer balance and gasless availability from the public precheck endpoint, so it
  # needs no relayer credentials and follows the relayer when its address changes.
  relayer-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://vote.sky.money
      NETWORK: mainnet
      MIN_RELAYER_BALANCE_ETH: '0.01'
    steps:
      - name: Check relayer balance and gasless availability
        run: |
          set -euo pipefail

          precheck=$(curl -sS --fail-with-body --retry 2 \
            "$BASE_URL/api/polling/precheck?network=$NETWORK&voter=0x0000000000000000000000000000000000000001&pollIds=1") ||
            { echo "ALERT_DETAIL=precheck request failed" >> "$GITHUB_ENV"; echo "$precheck"; exit 1; }
          echo "$precheck"

          balance=$(jq -r '.relayBalance' <<<"$precheck")
          reason=$(jq -r '.gaslessUnavailableReason // empty' <<<"$precheck")

          problems=()
          if ! [[ "$balance" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            problems+=("precheck returned no relayer balance")
          elif awk -v b="$balance" -v min="$MIN_RELAYER_BALANCE_ETH" 'BEGIN { exit !(b < min) }'; then
            problems+=("relayer balance is $balance ETH, below $MIN_RELAYER_BALANCE_ETH ETH")
          fi
          if [ -n "$reason" ]; then
            problems+=("gasless voting is unavailable ($reason)")
          fi

          if [ ${#problems[@]} -gt 0 ]; then
            detail=$(IFS='; '; echo "${problems[*]}")
            echo "ALERT_DETAIL=$detail" >> "$GITHUB_ENV"
            echo "$detail"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          GASLESS_WEBHOOK_URL: ${{ secrets.GASLESS_WEBHOOK_URL }}
        run: |
          jq -nc --arg content "Gasless relayer check failed: ${ALERT_DETAIL:-see run}. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{content: $content}' |
            curl -sS --fail-with-body -H 'Content-Type: application/json' --data @- "$GASLESS_WEBHOOK_URL"
