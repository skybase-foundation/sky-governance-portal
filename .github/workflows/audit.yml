name: Audit

on:
  pull_request:
  push:
    branches:
      - development
      - main
  schedule:
    - cron: '0 12 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--prod` scopes the audit to the runtime dependency tree. pnpm's `dev: true`
      # flag is unreliable in workspaces, so `--prod` is the reliable way to isolate
      # advisories that actually ship to the browser/server bundle.
      #
      # Level: `high`. Since APP-659 the job fails (shows red) on any high/critical runtime
      # advisory. It is not a required status check, so a red run flags the issue without
      # blocking merges (same as tarmac's Audit job).
      - name: pnpm audit (runtime, high+)
        run: pnpm audit --prod --audit-level high
